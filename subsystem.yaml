# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-student-request          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.8.1"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3234       # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/services
  not_found: /api/v1/services/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/services/not-a-uuid
  create:
    path: /api/v1/services
    allowed_role: staff
    denied_role: guest
    invalid_body:
      code: ""
    valid_body:
      code: CONFORMANCE_TEST
      title: Conformance Test Service
      description: Service used for authorization conformance checks
      inputs: []
      steps: []
      documents: []
      links: []
      contacts: []

owners:
  pl: "@csmju2030/pl-student-request"
  aie: "@csmju2030/aie-student-request"

display_name: "CSMJU Student Request"
repo: github.com/CSMJU2030/csmju-student-request
status: proposed
